name: Build APK
on:
  workflow_dispatch:        # 允许网页手动触发
  push:
    tags: ['v*']            # 打 tag 也自动构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: simple_live_app   # 本项目是子目录，务必改
        run: flutter pub get
      - name: Build
        working-directory: simple_live_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
