name: Build APK

on:
  workflow_dispatch:          # 网页手动触发
  push:
    tags: ['v*']              # 打 tag 自动构建并发布

permissions:
  contents: write             # 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      # 只有配了 Secrets 才写签名，否则跳过（Gradle 会自动回退 debug 签名）
      - name: Write signing config
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd simple_live_app/android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
              "${{ secrets.STORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" \
              "${{ secrets.KEY_ALIAS }}" > key.properties
            echo "使用正式签名"
          else
            echo "未配置签名 Secrets，回退 debug 签名"
          fi

      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: simple-live-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: simple_live_app/build/app/outputs/flutter-apk/*.apk
